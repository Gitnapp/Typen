name: typen
description: "Typen — a byte-faithful Markdown editor for macOS"
publish_to: 'none'
version: 0.5.6+29

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Rendering. The editable buffer is plain text — these only render the
  # read-only preview. Nothing here is ever allowed to write to disk.
  # Vendored: stock SelectionArea paints glyph-tight selection boxes with no
  # configuration seam; the vendored copy swaps the preview's text for a
  # RenderParagraph that reports full-line-height selection boxes.
  flutter_markdown_plus:
    path: vendor/flutter_markdown_plus
  markdown: ^7.3.1

  # File I/O + recents
  file_selector: ^1.0.3
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Update checker
  http: ^1.2.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/typen.png
