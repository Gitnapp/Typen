name: typen
description: "Typen — a byte-faithful Markdown editor for macOS"
publish_to: 'none'
version: 0.4.0+19

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Rendering. The editable buffer is plain text — these only render the
  # read-only preview. Nothing here is ever allowed to write to disk.
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.1

  # File I/O + recents
  file_selector: ^1.0.3
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Update checker
  http: ^1.2.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
